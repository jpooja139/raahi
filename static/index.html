<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raahi</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">
    <img class="brand-mark" src="/static/logo.png" alt="">
    <div>
      <h1>Raahi <span class="hindi">राही</span></h1>
      <p data-str="tagline"></p>
    </div>
  </div>
  <div class="lang-toggle" role="group" aria-label="Language">
    <button id="lang-en" class="active" type="button">EN</button>
    <button id="lang-hi" type="button">हिं</button>
  </div>
</header>

<main>
  <section class="panel chat-panel" aria-label="Chat with Raahi">
    <div id="chat-log" class="chat-log"></div>
    <form id="chat-form" class="chat-input">
      <button type="button" id="mic-btn" title="Voice (coming in Task 7)" disabled>🎙</button>
      <input id="chat-text" autocomplete="off" data-strph="chat_placeholder">
      <button type="button" id="dikhao-btn" hidden data-str="dikhao"></button>
      <button type="submit" data-str="send"></button>
    </form>
  </section>

  <section class="panel cards-panel" aria-label="Raahi's workbench">
    <div class="tool-launcher">
      <div class="tool" id="tool-linkdoctor">
        <h2 data-str="ld_title"></h2>
        <p data-str="ld_sub"></p>
        <form id="ld-form">
          <input id="ld-input" data-strph="ld_placeholder" autocomplete="off">
          <button type="submit" data-str="ld_scan"></button>
        </form>
        <div id="ld-report"></div>
      </div>
      <div class="tool" id="tool-rescue">
        <h2 data-str="tr_title"></h2>
        <p data-str="tr_sub"></p>
        <form id="tr-form">
          <input id="tr-input" data-strph="tr_placeholder" autocomplete="off">
          <button type="submit" data-str="tr_go"></button>
        </form>
        <div id="tr-report"></div>
      </div>
      <div class="tool" id="tool-decide">
        <h2 data-str="dc_title"></h2>
        <p data-str="dc_sub"></p>
        <form id="dc-form">
          <input id="dc-input" data-strph="dc_placeholder" autocomplete="off">
          <button type="submit" data-str="dc_go"></button>
        </form>
        <div id="dc-questions"></div>
        <div id="dc-card"></div>
        <div id="dc-roadmap"></div>
      </div>
    </div>
  </section>
</main>

<script src="/static/audio.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
